[plugin]

name="SpriteFrames To AnimationPlayer"
description="右键 AnimationPlayer → Import SpriteFrames（或 Project > Tools 同名入口）：选一个 AnimatedSprite2D、勾选要导入的动画，即可把 SpriteFrames 转成 AnimationPlayer 的 frame/animation 轨道。目标 AnimationPlayer 与动画库都可在对话框里切换，支持循环、同名覆盖、批量与撤销。"
author="AuAu"
version="1.3.3"
tags="2d,animation,tools"
script="plugin.gd"
